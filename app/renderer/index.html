<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self';
               img-src 'self' blob: data:;
               media-src 'self' blob: data:;
               style-src 'self' 'unsafe-inline';
               script-src 'self';">

  <title>AutoTrim</title>
  <link rel="icon" type="image/x-icon" href="icon.ico" />
  <meta http-equiv="Content-Security-Policy"
      content="default-src 'self';
               img-src 'self' blob: data:;
               media-src 'self' blob: data:;
               style-src 'self' 'unsafe-inline';
               script-src 'self';">
  <link rel="stylesheet" href="index.css" />
</head>

<body>
  <!-- Main grid -->
  <div class="content-grid">
    <!-- LEFT: thumbnail + select -->
    <aside class="thumb-card">
      <div id="thumb" class="thumb skeleton"></div>
      <div id="meta" class="file-meta">No file selected.</div>
      <div class="import-progress">
        <div id="importFill" class="import-fill"></div>
      </div>
      <button id="pickBtn" class="btn primary wide">Select video…</button>
      <input id="fileInput" type="file" accept="video/*" style="display:none" />
    </aside>

    <!-- RIGHT: Histogram + Trimming Parameters -->
    <section class="right-grid">
      <!-- Histogram panel -->
      <div class="panel">
        <div class="card-title">Histogram</div>
        <div class="chart-wrap"><canvas id="histChart"></canvas></div>

        <!-- range below chart -->
        <div class="h-range">
          <div class="range-labels">
            <span>Level range (dBFS)</span>
            <span id="rangeVals">—</span>
          </div>
          <div class="range-wrap">
            <div id="rangeFill" class="range-fill"></div>
            <input id="minDb" type="range" min="-80" max="-5" step="1" value="-50" />
            <input id="maxDb" type="range" min="-80" max="-5" step="1" value="-5" />
          </div>
        </div>
      </div>

      <!-- Trimming Parameters -->
      <div class="panel param-card">
        <div class="card-title">Trimming Parameters</div>

        <div class="v-sliders">
          <div class="vcol">
            <div class="vval" id="noiseDbVal">-23.0</div>
            <input id="noiseDb" class="vslider" type="range" min="-35" max="-10" step="0.1" value="-23" />
            <div class="vlabel">Noise<br><span class="unit">(dBFS)</span></div>
          </div>
          <div class="vcol">
            <div class="vval" id="silenceSVal">0.50</div>
            <input id="silenceS" class="vslider" type="range" min="0.2" max="2.0" step="0.05" value="0.5" />
            <div class="vlabel">Silence<br><span class="unit">(s)</span></div>
          </div>
          <div class="vcol">
            <div class="vval" id="padSVal">0.17</div>
            <input id="padS" class="vslider" type="range" min="0.0" max="0.5" step="0.01" value="0.17" />
            <div class="vlabel">Pad<br><span class="unit">(s)</span></div>
          </div>
          <div class="vcol">
            <div class="vval" id="keepSVal">0.75</div>
            <input id="keepS" class="vslider" type="range" min="0.25" max="5.0" step="0.05" value="0.75" />
            <div class="vlabel">Min clip<br><span class="unit">(s)</span></div>
          </div>
        </div>

        <button id="startTrimBtn" class="btn primary wide">Start</button>
      </div>
    </section>
  </div>

  <!-- Bottom status bar -->
  <div class="statusbar">
    <div id="status">Idle.</div>
    <progress id="progress" max="1" value="0"></progress>
  </div>

  <script src="../node_modules/chart.js/dist/chart.umd.js"></script>
  <script src="ui.js"></script>
</body>

</html>
