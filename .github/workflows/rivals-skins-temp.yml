name: Temporary Roblox RIVALS skin export

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/rivals-skins-temp.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-skins:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download and package every skin icon
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          import hashlib
          import html
          import json
          import re
          import shutil
          import struct
          import time
          import unicodedata
          import urllib.error
          import urllib.parse
          import urllib.request
          from collections import Counter
          from datetime import datetime, timezone
          from html.parser import HTMLParser
          from pathlib import Path

          API_URL = "https://robloxrivals.fandom.com/api.php"
          PAGE_URL = "https://robloxrivals.fandom.com/wiki/Skins"
          ROOT = Path("export") / "roblox_rivals_weapon_skins"
          ROOT.mkdir(parents=True, exist_ok=True)

          USER_AGENT = "Mozilla/5.0 (compatible; RIVALS-skin-export/1.1)"

          def fetch(url, *, accept="*/*", attempts=4, timeout=60):
              last_error = None
              for attempt in range(attempts):
                  try:
                      request = urllib.request.Request(
                          url,
                          headers={"User-Agent": USER_AGENT, "Accept": accept},
                      )
                      with urllib.request.urlopen(request, timeout=timeout) as response:
                          return response.read(), response.geturl(), response.headers.get_content_type()
                  except Exception as exc:
                      last_error = exc
                      if attempt + 1 < attempts:
                          time.sleep(1.5 * (attempt + 1))
              raise last_error

          params = urllib.parse.urlencode({
              "action": "parse",
              "page": "Skins",
              "prop": "text",
              "format": "json",
              "formatversion": "2",
          })
          raw_json, _, _ = fetch(f"{API_URL}?{params}", accept="application/json")
          rendered_html = json.loads(raw_json.decode("utf-8"))["parse"]["text"]

          class SkinTableParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.table_depth = 0
                  self.rarity = None
                  self.in_row = False
                  self.in_cell = False
                  self.cells = []
                  self.current_cell = None
                  self.records = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "table":
                      if self.table_depth:
                          self.table_depth += 1
                      elif attrs.get("data-type") == "skin":
                          self.table_depth = 1
                          self.rarity = (attrs.get("data-id") or "unknown").strip().lower()
                  elif self.table_depth and tag == "tr":
                      self.in_row = True
                      self.cells = []
                      self.current_cell = None
                  elif self.table_depth and self.in_row and tag == "td":
                      self.in_cell = True
                      self.current_cell = {"text": [], "img": None}
                      self.cells.append(self.current_cell)
                  elif self.table_depth and self.in_cell and tag == "img" and self.current_cell is not None:
                      self.current_cell["img"] = attrs
                  elif self.table_depth and self.in_cell and tag == "br" and self.current_cell is not None:
                      self.current_cell["text"].append(" ")

              def handle_endtag(self, tag):
                  if tag == "td" and self.table_depth and self.in_row:
                      self.in_cell = False
                      self.current_cell = None
                  elif tag == "tr" and self.table_depth and self.in_row:
                      self.in_row = False
                      if len(self.cells) >= 3 and self.cells[0].get("img"):
                          texts = [re.sub(r"\s+", " ", "".join(c["text"])).strip() for c in self.cells]
                          self.records.append({
                              "rarity_id": self.rarity,
                              "cells": texts,
                              "img": self.cells[0]["img"],
                          })
                      self.cells = []
                  elif tag == "table" and self.table_depth:
                      self.table_depth -= 1
                      if self.table_depth == 0:
                          self.rarity = None

              def handle_data(self, data):
                  if self.table_depth and self.in_cell and self.current_cell is not None:
                      self.current_cell["text"].append(data)

          parser = SkinTableParser()
          parser.feed(rendered_html)

          rarity_names = {
              "common": "Common",
              "rare": "Rare",
              "legendary": "Legendary",
              "mythical": "Mythical",
              "unique": "Unique",
              "glorious": "Glorious",
              "unobtainable": "Unobtainable",
          }
          rarity_order = {
              "Common": 1,
              "Rare": 2,
              "Legendary": 3,
              "Mythical": 4,
              "Unique": 5,
              "Glorious": 6,
              "Unobtainable": 7,
          }

          def safe_name(value):
              value = unicodedata.normalize("NFKC", value)
              value = re.sub(r'[<>:"/\\|?*\x00-\x1f]', "_", value)
              value = re.sub(r"\s+", " ", value).strip().rstrip(".")
              return value or "Unknown"

          def source_info(img_attrs):
              src = img_attrs.get("data-src") or img_attrs.get("src") or ""
              if src.startswith("//"):
                  src = "https:" + src
              if not src.startswith("http"):
                  src = urllib.parse.urljoin(PAGE_URL, src)

              filename = img_attrs.get("data-image-name")
              if not filename:
                  parts = urllib.parse.urlparse(src).path.split("/")
                  if "revision" in parts:
                      pos = parts.index("revision")
                      if pos > 0:
                          filename = urllib.parse.unquote(parts[pos - 1])
              if not filename:
                  filename = (img_attrs.get("alt") or "skin").replace(" ", "_") + ".png"

              normalized = filename.replace(" ", "_")
              digest = hashlib.md5(normalized.encode("utf-8")).hexdigest()
              quoted = urllib.parse.quote(normalized, safe="'()!$&,-._~")
              original = (
                  "https://static.wikia.nocookie.net/robloxrivals/images/"
                  f"{digest[0]}/{digest[:2]}/{quoted}/revision/latest"
              )
              return filename, original, src

          records = []
          for parsed in parser.records:
              cells = parsed["cells"]
              filename, original_url, fallback_url = source_info(parsed["img"])
              records.append({
                  "rarity": rarity_names.get(parsed["rarity_id"], parsed["rarity_id"].title()),
                  "skin_name": cells[1] if len(cells) > 1 else filename,
                  "weapon": cells[2] if len(cells) > 2 else "Unknown",
                  "obtainment_method": cells[3] if len(cells) > 3 else "",
                  "special_effects": cells[4] if len(cells) > 4 else "",
                  "wiki_filename": filename,
                  "source_url": original_url,
                  "fallback_url": fallback_url,
              })

          if len(records) < 300:
              raise RuntimeError(f"Only found {len(records)} skin rows; expected roughly 346.")

          records.sort(key=lambda r: (
              rarity_order.get(r["rarity"], 99),
              r["weapon"].casefold(),
              r["skin_name"].casefold(),
          ))

          cache = {}
          manifest = []
          failed = []
          png_signature = b"\x89PNG\r\n\x1a\n"

          for index, record in enumerate(records, start=1):
              rarity_folder = f"{rarity_order.get(record['rarity'], 99):02d}_{safe_name(record['rarity'])}"
              output_dir = ROOT / rarity_folder / safe_name(record["weapon"])
              output_dir.mkdir(parents=True, exist_ok=True)
              output_file = output_dir / f"{index:03d}_{safe_name(record['skin_name'])}.png"

              status = "ok"
              error = ""
              used_url = record["source_url"]
              width = height = 0
              sha256 = ""

              try:
                  cache_key = record["wiki_filename"]
                  if cache_key not in cache:
                      png_bytes = None
                      last_error = None
                      for candidate in (record["source_url"], record["fallback_url"]):
                          try:
                              data, final_url, content_type = fetch(
                                  candidate,
                                  accept="image/png,image/*;q=0.8,*/*;q=0.5",
                              )
                              if not data.startswith(png_signature):
                                  raise ValueError(f"not PNG ({content_type}, magic={data[:12]!r})")
                              if len(data) < 24:
                                  raise ValueError("truncated PNG")
                              width, height = struct.unpack(">II", data[16:24])
                              png_bytes = data
                              used_url = final_url
                              break
                          except Exception as exc:
                              last_error = exc
                      if png_bytes is None:
                          raise last_error or RuntimeError("download failed")
                      cache[cache_key] = (png_bytes, width, height, used_url)

                  png_bytes, width, height, used_url = cache[cache_key]
                  output_file.write_bytes(png_bytes)
                  sha256 = hashlib.sha256(png_bytes).hexdigest()
              except Exception as exc:
                  status = "failed"
                  error = f"{type(exc).__name__}: {exc}"
                  failed.append({**record, "error": error})

              manifest.append({
                  "index": index,
                  "rarity": record["rarity"],
                  "skin_name": record["skin_name"],
                  "weapon": record["weapon"],
                  "obtainment_method": record["obtainment_method"],
                  "special_effects": record["special_effects"],
                  "wiki_filename": record["wiki_filename"],
                  "source_url": used_url,
                  "output_path": str(output_file.relative_to(ROOT.parent)) if status == "ok" else "",
                  "width": width,
                  "height": height,
                  "sha256": sha256,
                  "status": status,
                  "error": error,
              })
              print(f"[{index:03d}/{len(records)}] {status}: {record['weapon']} — {record['skin_name']}", flush=True)

          fields = list(manifest[0].keys())
          with (ROOT / "manifest.csv").open("w", newline="", encoding="utf-8-sig") as file:
              writer = csv.DictWriter(file, fieldnames=fields)
              writer.writeheader()
              writer.writerows(manifest)
          (ROOT / "manifest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8")

          counts = Counter(item["rarity"] for item in manifest)
          readme = [
              "Roblox RIVALS weapon skin icons",
              "=================================",
              "",
              f"Source: {PAGE_URL}",
              f"Generated: {datetime.now(timezone.utc).isoformat()}",
              f"Wiki rows found: {len(manifest)}",
              f"PNG files saved: {sum(item['status'] == 'ok' for item in manifest)}",
              f"Failed downloads: {len(failed)}",
              "",
              "Rows by wiki category:",
          ]
          readme.extend(f"- {name}: {counts[name]}" for name in sorted(counts, key=lambda n: rarity_order.get(n, 99)))
          readme.extend([
              "",
              "The archive preserves every skin row listed on the wiki, including duplicate, test, and unobtainable entries.",
              "Every saved file was verified by PNG signature. See manifest.csv for source URLs, dimensions, and SHA-256 hashes.",
          ])
          (ROOT / "README.txt").write_text("\n".join(readme) + "\n", encoding="utf-8")

          if failed:
              (ROOT / "failed_downloads.json").write_text(json.dumps(failed, ensure_ascii=False, indent=2), encoding="utf-8")

          shutil.make_archive("roblox_rivals_all_weapon_skins", "zip", root_dir=ROOT.parent, base_dir=ROOT.name)
          print(f"Created archive with {len(manifest) - len(failed)} PNGs; {len(failed)} failures.", flush=True)

          if failed:
              raise RuntimeError(f"{len(failed)} skin icons failed; see failed_downloads.json")
          PY

      - name: Upload ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roblox-rivals-weapon-skins
          path: roblox_rivals_all_weapon_skins.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
